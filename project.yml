name: CounterSwiftUI

options:
  bundleIdPrefix: com.eloddobos
  deploymentTarget:
    iOS: "18.2"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P7R9UNDM2M
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  CounterSwiftUI:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eloddobos.CounterSwiftUI
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Sources/Preview Content"'
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - Tests
    dependencies:
      - target: CounterSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eloddobos.CounterSwiftUI.Tests
        GENERATE_INFOPLIST_FILE: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

schemes:
  CounterSwiftUI:
    build:
      targets:
        CounterSwiftUI: all
        Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Tests
    archive:
      config: Release
