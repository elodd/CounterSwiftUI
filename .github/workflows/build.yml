name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Release build (iOS device, unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CounterSwiftUI.xcodeproj \
            -scheme CounterSwiftUI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            ${{ steps.version.outputs.args }} \
            | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$DERIVED_DATA/Build/Products/Release-iphoneos/CounterSwiftUI.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/CounterSwiftUI-$GITHUB_REF_NAME-unsigned.ipa" Payload

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/CounterSwiftUI-$GITHUB_REF_NAME-unsigned.ipa" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
